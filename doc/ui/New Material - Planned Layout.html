<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Material — Planned Layout</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#16181d;background:#f6f7f9;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .lbl{display:block;margin-bottom:4px;font-size:12px;font-weight:500;color:#5b6472}
  .fld{height:36px;width:100%;border-radius:6px;border:1px solid #e3e6ea;background:#fff;font-size:14px}
  select.fld{padding:0 8px}
  input.fld{padding:0 12px}
  .picker{display:flex;align-items:center;justify-content:space-between;height:36px;width:100%;border-radius:6px;border:1px solid #e3e6ea;background:#fff;padding:0 12px;font-size:14px;color:#5b6472;cursor:pointer}
  .picker.set{color:#16181d}
  .sec{display:flex;flex-direction:column;gap:12px;border-radius:8px;border:1px solid #e3e6ea;padding:12px}
  .sec-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#5b6472}
  .hint{margin:4px 0 0;font-size:12px;color:#5b6472}
  .req{color:#b91c1c}
  .ibtn{display:flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:6px;border:1px solid #e3e6ea;background:#fff;cursor:pointer;color:#5b6472}
  .ibtn:hover{background:#f1f3f5;color:#16181d}
  .ibtn.del:hover{background:#fee2e2;color:#b91c1c}
  .ibtn.close{border:none;background:none}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- Full-screen master editor -->
<div role="dialog" style="position:fixed;inset:0;display:flex;flex-direction:column;background:#fff">
  <div style="display:flex;flex-shrink:0;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e3e6ea;padding:14px 32px">
    <h2 style="margin:0;font-size:18px;font-weight:600">New Material</h2>
    <button aria-label="Close" style="flex-shrink:0;border-radius:6px;border:none;background:none;cursor:pointer;padding:4px;color:#5b6472;font-size:16px">✕</button>
  </div>

  <div style="min-height:0;flex:1;overflow-y:auto;padding:24px 32px">
    <div style="margin:0 auto;width:100%;max-width:1180px;display:flex;flex-direction:column;gap:16px">

      <!-- Identity row -->
      <div style="display:grid;grid-template-columns:0.85fr 1.4fr 0.85fr;gap:16px;align-items:start">
        <div>
          <label class="lbl">Item Class</label>
          <select class="fld" id="iclass">
            <option value="YARN">YARN</option>
            <option value="FABRIC">FABRIC</option>
            <option value="GENERAL">GENERAL</option>
            <option value="SEWING">SEWING ACCESSORIES</option>
            <option value="PACKING">PACKING MATERIAL</option>
            <option value="TRIMS">TRIMS</option>
            <option value="CHEMICALS">DYES &amp; CHEMICALS</option>
          </select>
        </div>
        <div>
          <label class="lbl">Name <span class="req">*</span></label>
          <input class="fld">
          <p class="hint">The code is generated automatically from the name.</p>
        </div>
        <div>
          <label class="lbl">HSN Code</label>
          <button class="picker"><span>— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
        </div>
      </div>

      <!-- Two-column body -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">

        <!-- LEFT: class-specific detail -->
        <div style="display:flex;flex-direction:column;gap:16px">

          <!-- YARN -->
          <div id="yarn" style="display:flex;flex-direction:column;gap:16px">
            <div class="sec">
              <div class="sec-h">Yarn Type</div>
              <div><label class="lbl">Yarn Type</label>
                <select class="fld"><option>— Select —</option><option>Grey</option><option>Melange</option><option>Twisted</option><option>Doubling</option></select>
              </div>
            </div>
            <div class="sec">
              <div class="sec-h">Classification</div>
              <div><label class="lbl">Count</label>
                <select class="fld"><option>— Select —</option><option>20s</option><option>30s</option><option>40s</option></select>
              </div>
              <div><label class="lbl">Category</label>
                <button class="picker" id="catField"><span id="catText">— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
              </div>
              <div><label class="lbl">Purity</label>
                <button class="picker"><span>— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
              </div>
            </div>
          </div>

          <!-- FABRIC -->
          <div id="fabric" hidden style="display:flex;flex-direction:column;gap:16px">
            <div class="sec">
              <div class="sec-h">Classification</div>
              <div><label class="lbl">Structure</label>
                <button class="picker"><span>— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
              </div>
              <div><label class="lbl">Type</label>
                <select class="fld"><option>— Select —</option><option>Circular Knit</option><option>Flat Knit</option><option>Woven</option></select>
                <p class="hint">Circular Knit, Flat Knit or Woven — sets the UOM (kg / nos+kg / mtr+kg).</p>
              </div>
              <div><label class="lbl">Fabric Type <span class="req">*</span></label>
                <select class="fld"><option>— Select —</option><option>Solid</option><option>Yarn Dyed</option><option>Melange</option></select>
                <p class="hint">Solid, Yarn Dyed or Melange — determines the dyeing PO type.</p>
              </div>
            </div>
            <div class="sec">
              <div class="sec-h">Composition</div>
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" style="height:16px;width:16px;cursor:pointer;accent-color:#4f46e5">
                <span style="font-size:14px;color:#16181d">Direct Purchase</span>
              </label>
              <div><label class="lbl">Using</label>
                <select class="fld"><option>— None —</option><option>Single Yarn</option><option>Multiple Yarn</option></select>
              </div>
            </div>
          </div>

          <!-- GENERIC -->
          <div id="generic" hidden>
            <div class="sec">
              <div class="sec-h">Classification</div>
              <div><label class="lbl">Category</label>
                <button class="picker"><span>— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
              </div>
              <div><label class="lbl">Type</label>
                <select class="fld"><option>— Select —</option><option>Raw Material</option><option>Consumable</option><option>Finished</option><option>Service</option></select>
              </div>
              <div><label class="lbl">Specifications</label><input class="fld"></div>
            </div>
          </div>
        </div>

        <!-- RIGHT: UOM -->
        <div class="sec">
          <div class="sec-h">Units of Measure</div>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px">
            <div><label class="lbl">Base UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
            <div><label class="lbl">Stock UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
            <div><label class="lbl">Billing UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
            <div><label class="lbl">Planning UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
            <div><label class="lbl">Purchase UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink:0;border-top:1px solid #e3e6ea;background:#fff;padding:12px 32px">
    <div style="margin:0 auto;display:flex;width:100%;max-width:1180px;align-items:center;justify-content:flex-end;gap:8px">
      <button style="display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;font-size:14px;font-weight:500;border-radius:6px;border:1px solid #e3e6ea;cursor:pointer;background:#fff;color:#16181d">Cancel</button>
      <button style="display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;font-size:14px;font-weight:500;border-radius:6px;border:none;cursor:pointer;background:#4f46e5;color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05)">Save</button>
    </div>
  </div>
</div>

<!-- Lookup dialog picker (Category) -->
<div id="dlg" hidden>
  <div style="position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.5)" id="scrim"></div>
  <div style="position:fixed;inset:0;z-index:97;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none">
    <div role="dialog" style="pointer-events:auto;display:flex;flex-direction:column;width:100%;max-width:480px;max-height:88vh;overflow:hidden;border-radius:12px;border:1px solid #e3e6ea;background:#fff;box-shadow:0 20px 50px rgba(16,24,40,.25)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e3e6ea;padding:12px 16px 12px 20px">
        <h2 style="margin:0;font-size:16px;font-weight:600">Category</h2>
        <div style="display:flex;align-items:center;gap:4px">
          <button class="ibtn" title="Add"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
          <button class="ibtn" title="Modify"><i data-lucide="square-pen" style="width:16px;height:16px"></i></button>
          <button class="ibtn del" title="Delete"><i data-lucide="trash-2" style="width:15px;height:15px"></i></button>
          <div style="width:1px;height:20px;background:#e3e6ea;margin:0 4px"></div>
          <button class="ibtn close" id="dlgClose" title="Close"><i data-lucide="x" style="width:18px;height:18px"></i></button>
        </div>
      </div>
      <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px">
        <input id="catSearch" placeholder="Search…" style="height:40px;width:100%;border-radius:8px;border:1px solid #e3e6ea;background:#fff;padding:0 12px;font-size:14px">
        <div id="catList" style="display:flex;flex-direction:column;gap:10px"></div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;border-top:1px solid #e3e6ea;padding-top:14px">
          <button id="dlgCancel" style="height:36px;padding:0 14px;border-radius:6px;border:1px solid #e3e6ea;background:#fff;color:#16181d;font-size:14px;font-weight:500;cursor:pointer">Cancel</button>
          <button id="dlgOk" style="height:36px;padding:0 24px;border-radius:6px;border:none;background:#4f46e5;color:#fff;font-size:14px;font-weight:600;cursor:pointer">OK</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Item-class-driven sections
  const iclass = document.getElementById('iclass');
  function syncClass(){
    const v = iclass.value;
    document.getElementById('yarn').hidden = v !== 'YARN';
    document.getElementById('fabric').hidden = v !== 'FABRIC';
    document.getElementById('generic').hidden = v === 'YARN' || v === 'FABRIC';
  }
  iclass.addEventListener('change', syncClass);

  // Category lookup picker
  const OPTS = ['COTTON','ELASTANE','POLYESTER','VISCOSE','MODAL','LINEN'];
  let sel = 'COTTON';
  const dlg = document.getElementById('dlg'), list = document.getElementById('catList'),
        search = document.getElementById('catSearch'), catText = document.getElementById('catText');
  function renderList(){
    const q = search.value.toLowerCase();
    list.innerHTML = '';
    OPTS.filter(o=>o.toLowerCase().includes(q)).forEach(o=>{
      const b = document.createElement('button');
      const on = o === sel;
      b.textContent = o;
      b.style.cssText = 'display:block;width:100%;text-align:left;border-radius:8px;padding:14px 16px;font-size:14px;cursor:pointer;color:#16181d;border:1px solid '+(on?'rgba(79,70,229,.35)':'#e3e6ea')+';background:'+(on?'#edeffb':'#fff');
      b.onclick = ()=>{ sel = o; renderList(); };
      list.appendChild(b);
    });
  }
  function openDlg(){ dlg.hidden=false; renderList(); }
  function closeDlg(){ dlg.hidden=true; }
  document.getElementById('catField').onclick = openDlg;
  document.getElementById('scrim').onclick = closeDlg;
  document.getElementById('dlgClose').onclick = closeDlg;
  document.getElementById('dlgCancel').onclick = closeDlg;
  document.getElementById('dlgOk').onclick = ()=>{ catText.textContent = sel; document.getElementById('catField').classList.add('set'); closeDlg(); };
  search.addEventListener('input', renderList);

  syncClass();
  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
