<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Material (Fabric) — Organized Layout</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#16181d;background:#fff;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .lbl{display:block;margin-bottom:2px;font-size:12px;font-weight:500;color:#5b6472}
  .lbl-i{display:flex;align-items:center;gap:4px}
  .info{display:inline-flex;cursor:help;color:#9aa4b2}
  .fld{height:32px;width:100%;border-radius:6px;border:1px solid #e3e6ea;background:#fff;font-size:14px}
  select.fld{padding:0 8px}
  input.fld{padding:0 12px}
  .picker{display:flex;align-items:center;justify-content:space-between;height:32px;width:100%;border-radius:6px;border:1px solid #e3e6ea;background:#fff;padding:0 12px;font-size:14px;color:#5b6472;cursor:pointer}
  .hint{margin:4px 0 0;font-size:12px;color:#5b6472}
  .req{color:#b91c1c}
  .sec{display:flex;flex-direction:column;gap:8px;border-radius:8px;border:1px solid #e3e6ea;padding:10px 12px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#5b6472}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .rowcard{border-radius:8px;border:1px solid #e3e6ea;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .rowcard-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:#5b6472}
  .delx{display:flex;align-items:center;justify-content:center;height:24px;width:24px;border-radius:6px;border:none;background:none;color:#9aa4b2;cursor:pointer}
  .delx:hover{background:#fee2e2;color:#b91c1c}
  .addbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid #e3e6ea;background:#fff;color:#16181d;font-size:13px;font-weight:500;cursor:pointer;align-self:flex-start}
  .addbtn:hover{background:#f1f3f5}
  .divider{height:1px;background:#e3e6ea;margin:4px 0}
</style>
</head>
<body>

<div role="dialog" style="position:fixed;inset:0;display:flex;flex-direction:column;background:#fff">
  <div style="display:flex;flex-shrink:0;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e3e6ea;padding:14px 32px">
    <h2 style="margin:0;font-size:18px;font-weight:600">New Material</h2>
    <button aria-label="Close" style="border-radius:6px;border:none;background:none;cursor:pointer;padding:4px;color:#5b6472;font-size:16px">✕</button>
  </div>

  <div style="min-height:0;flex:1;overflow-y:auto;padding:16px 32px">
    <div style="margin:0 auto;width:100%;max-width:1180px;display:flex;flex-direction:column;gap:12px">

      <!-- Identity row -->
      <div style="display:grid;grid-template-columns:0.85fr 1.4fr 0.85fr;gap:12px;align-items:start">
        <div>
          <label class="lbl">Item Class</label>
          <select class="fld"><option>FABRIC</option><option>YARN</option><option>GENERAL</option></select>
        </div>
        <div>
          <label class="lbl">Name <span class="req">*</span></label>
          <input class="fld" value="(20'S COTTON COMBED 20%) 100%">
          <p class="hint">The code is generated automatically from the name.</p>
        </div>
        <div>
          <label class="lbl">HSN Code</label>
          <button class="picker"><span>— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
        </div>
      </div>

      <!-- Two balanced columns: WHAT IT IS (left) · HOW IT'S MEASURED (right) -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">

        <!-- LEFT: composition story -->
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="sec">
            <div class="sec-h">Classification</div>
            <div class="grid2">
              <div>
                <label class="lbl">Structure</label>
                <button class="picker"><span>— None —</span><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
              </div>
              <div>
                <label class="lbl lbl-i">Type <span class="info" title="Circular Knit, Flat Knit or Woven — sets the UOM (kg / nos+kg / mtr+kg)."><i data-lucide="info" style="width:13px;height:13px"></i></span></label>
                <select class="fld"><option>— Select —</option><option>Circular Knit</option><option>Flat Knit</option><option>Woven</option></select>
              </div>
              <div>
                <label class="lbl lbl-i">Fabric Type <span class="req">*</span> <span class="info" title="Solid, Yarn Dyed or Melange — determines the dyeing PO type."><i data-lucide="info" style="width:13px;height:13px"></i></span></label>
                <select class="fld"><option>— Select —</option><option>Solid</option><option>Yarn Dyed</option><option>Melange</option></select>
              </div>
            </div>
          </div>

          <div class="sec">
            <div class="sec-h">Composition</div>
            <div class="grid2" style="align-items:end">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;height:34px">
                <input type="checkbox" style="height:16px;width:16px;cursor:pointer;accent-color:#4f46e5">
                <span style="font-size:14px;color:#16181d">Direct Purchase</span>
              </label>
              <div>
                <label class="lbl">Using</label>
                <select class="fld"><option>— None —</option><option>Single Yarn</option><option>Multiple Yarn</option></select>
              </div>
            </div>

            <!-- Mixing attributes belong to Composition — nested right under it -->
            <div class="divider"></div>
            <div class="sec-h">Attributes (Mixing)<span id="mixBadge" style="font-weight:600">0% of 100%</span></div>
            <div id="mixRows" style="display:flex;flex-direction:column;gap:10px"></div>
            <button class="addbtn" id="addMix"><i data-lucide="plus" style="width:14px;height:14px"></i>Add row</button>
          </div>
        </div>

        <!-- RIGHT: measurement -->
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="sec">
            <div class="sec-h">Units of Measure</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px">
              <div><label class="lbl">Base UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
              <div><label class="lbl">Stock UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
              <div><label class="lbl">Billing UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
              <div><label class="lbl">Planning UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
              <div><label class="lbl">Purchase UOM</label><select class="fld"><option>— None —</option><option>KG</option><option>NOS</option><option>MTR</option></select></div>
            </div>
          </div>

          <div class="sec">
            <div class="sec-h">Alternate ↔ Base Conversions</div>
            <div id="convRows" style="display:flex;flex-direction:column;gap:10px"></div>
            <button class="addbtn" id="addConv"><i data-lucide="plus" style="width:14px;height:14px"></i>Add conversion</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-shrink:0;border-top:1px solid #e3e6ea;background:#fff;padding:12px 32px">
    <div style="margin:0 auto;display:flex;width:100%;max-width:1180px;align-items:center;justify-content:flex-end;gap:8px">
      <button style="height:36px;padding:0 16px;font-size:14px;font-weight:500;border-radius:6px;border:1px solid #e3e6ea;cursor:pointer;background:#fff;color:#16181d">Cancel</button>
      <button style="height:36px;padding:0 16px;font-size:14px;font-weight:600;border-radius:6px;border:none;cursor:pointer;background:#4f46e5;color:#fff">Save</button>
    </div>
  </div>
</div>

<script>
  const YARNS = ["20'S COTTON COMBED","30'S POLYESTER","40'S VISCOSE","ELASTANE 40D","30'S MODAL"];
  const UOMS = ["— None —","KG","NOS","MTR"];
  const mixRows = document.getElementById('mixRows'), convRows = document.getElementById('convRows'), badge = document.getElementById('mixBadge');

  function opts(list){ return list.map(o=>`<option>${o}</option>`).join(''); }
  function recalcBadge(){
    let sum = 0;
    mixRows.querySelectorAll('input.mixpct').forEach(i=> sum += parseFloat(i.value)||0);
    badge.textContent = sum + '% of 100%';
    badge.style.color = Math.abs(sum-100) < 0.01 ? '#15803d' : '#b91c1c';
  }
  function renumber(container){ [...container.children].forEach((c,i)=> c.querySelector('.rowcard-h span').textContent = '#'+(i+1)); }

  function addMix(){
    const c = document.createElement('div'); c.className='rowcard';
    c.innerHTML = `
      <div class="rowcard-h"><span>#1</span><button class="delx" aria-label="Remove"><i data-lucide="x" style="width:15px;height:15px"></i></button></div>
      <select class="fld">${opts(YARNS)}</select>
      <input class="fld mixpct" type="number" placeholder="Mixing %">`;
    c.querySelector('.delx').onclick=()=>{ c.remove(); renumber(mixRows); recalcBadge(); };
    c.querySelector('.mixpct').addEventListener('input', recalcBadge);
    mixRows.appendChild(c); renumber(mixRows); recalcBadge();
    if(window.lucide) lucide.createIcons();
  }
  function addConv(){
    const c = document.createElement('div'); c.className='rowcard';
    c.innerHTML = `
      <div class="rowcard-h"><span>#1</span><button class="delx" aria-label="Remove"><i data-lucide="x" style="width:15px;height:15px"></i></button></div>
      <div class="grid2">
        <input class="fld" placeholder="Alt qty"><select class="fld">${opts(UOMS)}</select>
        <input class="fld" placeholder="Base qty"><select class="fld">${opts(UOMS)}</select>
      </div>`;
    c.querySelector('.delx').onclick=()=>{ c.remove(); renumber(convRows); };
    convRows.appendChild(c); renumber(convRows);
    if(window.lucide) lucide.createIcons();
  }
  document.getElementById('addMix').onclick = addMix;
  document.getElementById('addConv').onclick = addConv;
  addMix(); addConv();
  if(window.lucide) lucide.createIcons();
</script>
</body>
</html>
